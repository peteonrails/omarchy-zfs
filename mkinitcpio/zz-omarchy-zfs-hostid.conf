# Managed by omarchy-zfs. Keep /etc/hostid inside every initramfs.
#
# ZFS refuses to import a pool whose label records a different hostid without
# -f ("pool was previously in use from another system"), so the hostid the
# initramfs sees must match the one the pool was created with. The zfs
# mkinitcpio install hook normally copies /etc/hostid in for us, but relying on
# that alone puts a boot-critical file at the mercy of somebody else's hook:
#
#   - `omarchy update` runs pacman -Syu --overwrite '*/omarchy_hooks.conf'
#     every time, so anything living in Omarchy's own drop-in is replaced with
#     the stock (ZFS-less) version on every update.
#   - our zz-omarchy-zfs.conf is GENERATED by omarchy-zfs-ensure-mkinitcpio, so
#     it is only as reliable as that script having run.
#
# This file is static and package-owned: it is not generated, not derived, and
# not something an upstream --overwrite has any reason to touch. Because
# omarchy-zfs-ensure-mkinitcpio evaluates the whole conf.d chain (skipping only
# its own drop-in) when it builds the standalone ZBM config, the entry is
# inherited by the in-pool image as well.
#
# Guarded so a missing /etc/hostid cannot fail the initramfs build: mkinitcpio
# treats a FILES entry that does not exist as an error, and an unbootable
# system is a worse outcome than a forced import.
#
# Written as an if-block rather than `[[ -f ... ]] && FILES+=(...)` so that a
# missing /etc/hostid cannot make sourcing this file return non-zero, which
# some callers treat as a config error.
if [[ -f /etc/hostid ]]; then
  FILES+=(/etc/hostid)
fi
