# Installed by omarchy-zfs.
#
# On a ZFS root, /var/log is usually its own dataset mounted by
# zfs-mount.service. systemd-journal-flush runs early and, finding
# /var/log/journal absent (the dataset is not mounted yet), leaves journald
# in volatile mode for the whole boot — the installed system then logs
# NOWHERE, which is exactly how a broken graphical session becomes
# undebuggable (observed all through ISO validation, 2026-08-18).
#
# Ordering the flush after zfs-mount lets journald find the real
# /var/log/journal and persist.
[Unit]
After=zfs-mount.service
Wants=zfs-mount.service
