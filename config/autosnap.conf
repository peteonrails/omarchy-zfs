# Configuration for omarchy-zfs-autosnap (pre-upgrade ZFS snapshots).
# Installed to /etc/omarchy-zfs/autosnap.conf. Sourced as bash.

# Set to 0 to disable automatic pre-upgrade snapshots entirely.
OMARCHY_ZFS_AUTOSNAP=1

# How many autosnap snapshots to retain on the root dataset (older ones are
# pruned after each new snapshot).
OMARCHY_ZFS_AUTOSNAP_KEEP=10

# Force a specific pool. Leave empty to auto-discover the pool backing / .
OMARCHY_ZFS_AUTOSNAP_POOL=
