# omarchy-zfs repo guard.
#
# Whenever /etc/pacman.conf changes, omarchy-zfs-pacman-repo puts the
# [omarchy-zfs] section back if it is missing, and trusts the release key.
# Omarchy rewrites pacman.conf from its own templates on a channel switch and
# during install, which drops the repo and with it every omarchy-zfs update.
# It only ever appends that one section.
#
# Set to 0 if you install omarchy-zfs some other way and want to manage the
# repo yourself.
#OMARCHY_ZFS_REPO_GUARD=0
