# omarchy-zfs boot-order guard.
#
# After every pacman transaction, omarchy-zfs-bootorder-guard checks that an
# active ZFSBootMenu entry is first in the EFI BootOrder, and moves it back to
# the front if something (usually limine-install, which omarchy pulls in as a
# hard dependency) displaced it. It only ever reorders -- it never deletes
# another bootloader's NVRAM entry.
#
# Set to 0 if you boot this ZFS system through something other than
# ZFSBootMenu and want to manage BootOrder yourself.
#OMARCHY_ZFS_BOOTORDER_GUARD=0
